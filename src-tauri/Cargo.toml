[package]
name = "ai-cli-auth-manager"
version = "0.1.0"
description = "Windows desktop manager for Claude Code, Gemini CLI, and Codex CLI authentication."
authors = ["AI CLI Auth Manager"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
